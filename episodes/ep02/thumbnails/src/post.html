<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(Lalezar.ttf)}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(thA.jpg) 50% 50%/auto 100%;filter:saturate(1.15) contrast(1.05)}
.g1{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(rgba(30,10,60,.8),rgba(30,10,60,0))}
.vig{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,10,60,.85) 0%,rgba(30,10,60,0) 40%)}
.s{font-family:L;color:#FFD54A;text-shadow:-6px -6px 0 #2B1450,6px -6px 0 #2B1450,-6px 6px 0 #2B1450,6px 6px 0 #2B1450,0 -8px 0 #2B1450,0 8px 0 #2B1450,-8px 0 0 #2B1450,8px 0 0 #2B1450,0 14px 0 #2B1450,0 18px 26px rgba(0,0,0,.55);line-height:1.05;position:absolute;left:0;right:0;text-align:center}
.t{bottom:150px;font-size:150px}
.pill{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-family:L;font-size:64px;color:#fff;background:#E5486B;border:6px solid #2B1450;border-radius:50px;padding:8px 40px 0;white-space:nowrap}
.yt{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-family:L;font-size:50px;color:#fff;text-shadow:-4px -4px 0 #2B1450,4px -4px 0 #2B1450,-4px 4px 0 #2B1450,4px 4px 0 #2B1450}
</style></head><body><div class="bg"></div><div class="g1"></div><div class="vig"></div>
<div class="pill">الحلقة ٢ نزلت! 🎉</div>
<div class="s t">مدينة الحلويات</div>
<div class="yt">شوفوها كاملة على يوتيوب: عالم الحواديت ▶️</div></body></html>
